{% extends "base.html" %}
{% block title %}Rainfall History — AgroStar{% endblock %}
{% block content %}
<div class="topbar">
  <a class="back-btn" href="/features">←</a>
  <h1 style="font-size:18px;" data-i18n="hdr_rainfall">Rainfall History</h1>
  <div style="width:38px;"></div>
</div>
<div class="page-body">
  <div class="field">
    <label data-i18n="lbl_location">Location</label>
    <select id="locSelect" onchange="loadRainfall()"></select>
  </div>

  <div class="card" id="summaryCard">
    <div class="skeleton skeleton-line short"></div>
    <div class="skeleton skeleton-block" style="margin-top:10px;"></div>
  </div>

  <div class="section-title" data-i18n="sec_monthwise_rainfall">Month-wise Rainfall (mm)</div>
  <div class="card">
    <div id="rainChart" style="display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px;"></div>
  </div>

  <div class="section-title" data-i18n="sec_monthly_detail">Monthly Detail</div>
  <div id="monthList"></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
function populateLocations(selectId, cb){
  fetch('/api/locations').then(r=>r.json()).then(d=>{
    const sel = document.getElementById(selectId);
    sel.innerHTML = d.locations.map(l=>`<option value="${l}">${l}</option>`).join('');
    if(cb) cb();
  });
}

function loadRainfall(){
  const loc = document.getElementById('locSelect').value || 'Bhubaneswar (City Centre)';
  fetch('/api/rainfall_history?location=' + encodeURIComponent(loc)).then(r=>r.json()).then(d=>{

    // Summary card
    document.getElementById('summaryCard').innerHTML = `
      <div class="flex-between">
        <div>
          <div class="muted">${t('txt_this_year_so_far')}</div>
          <div style="font-family:var(--font-display);font-size:26px;color:var(--leaf-700);">${d.total_actual_mm} mm</div>
        </div>
        <span class="chip chip-${d.deviation_percent > 0 ? 'up' : d.deviation_percent < -10 ? 'down' : 'stable'}">
          ${d.deviation_percent > 0 ? '▲' : '▼'} ${Math.abs(d.deviation_percent)}% ${t('txt_vs_normal')}
        </span>
      </div>
      <p class="muted" style="margin-top:8px;">${d.summary}</p>
    `;

    // Simple bar chart using the growth-stalk style bars
    const maxVal = Math.max(...d.history.map(h => Math.max(h.actual_mm, h.normal_mm)));
    document.getElementById('rainChart').innerHTML = d.history.map(h => {
      const heightPx = Math.max(4, Math.round((h.actual_mm / maxVal) * 120));
      const color = h.status === 'above' ? 'var(--sky-600)' : h.status === 'below' ? 'var(--gold-600)' : 'var(--leaf-500)';
      return `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div style="width:100%;max-width:22px;height:${heightPx}px;background:${color};border-radius:4px 4px 0 0;"></div>
          <span style="font-size:9px;color:var(--text-soft);">${h.month}</span>
        </div>`;
    }).join('');

    // Detail list
    document.getElementById('monthList').innerHTML = d.history.map(h => `
      <div class="card flex-between" style="padding:12px 16px;margin-bottom:8px;">
        <span><b>${h.month}</b></span>
        <span>${h.actual_mm} mm <span class="muted">(${t('txt_normal')} ${h.normal_mm} mm)</span></span>
        <span class="chip chip-${h.status==='above'?'up':h.status==='below'?'down':'stable'}">${h.status}</span>
      </div>`).join('');
  });
}
populateLocations('locSelect', loadRainfall);
</script>
{% endblock %}
